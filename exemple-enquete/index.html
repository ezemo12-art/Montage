<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0b0b0c;
        --ink: #efe9e1;
        --accent: #c1121f;
        --font-display: "Oswald";
        --font-mono: "IBM Plex Mono";
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); color: var(--ink); }
      #file-tag { position: absolute; top: 300px; left: 150px; font-family: var(--font-mono); font-size: 32px; letter-spacing: 0.2em; color: var(--accent); }
      #case-title { position: absolute; top: 370px; left: 150px; width: 740px; font-size: 128px; line-height: 1.08; font-weight: 700; text-transform: uppercase; }
      #rule { position: absolute; top: 640px; left: 150px; width: 740px; height: 6px; }
      #rule-bar { width: 100%; height: 100%; background: var(--accent); transform-origin: left center; }
      #meta { position: absolute; top: 680px; left: 150px; font-family: var(--font-mono); font-size: 40px; letter-spacing: 0.08em; opacity: 0.85; }
      .cap { position: absolute; top: 960px; left: 150px; width: 740px; text-align: center; font-size: 72px; font-weight: 600; line-height: 1.1; text-transform: uppercase; }
      .cap em { font-style: normal; color: var(--accent); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1080" data-height="1920">
      <audio id="voice" class="clip" src="assets/voix.wav" data-start="0" data-duration="8.11" data-track-index="9"></audio>

      <div id="file-tag" class="clip" data-start="0" data-duration="9" data-track-index="0"><span id="file-tag-in">DOSSIER N°0314</span></div>
      <h1 id="case-title" class="clip" data-start="0" data-duration="9" data-track-index="1"><span id="case-title-in" style="display:block">Affaire non résolue</span></h1>
      <div id="rule" class="clip" data-start="0" data-duration="9" data-track-index="2"><div id="rule-bar"></div></div>
      <div id="meta" class="clip" data-start="0" data-duration="9" data-track-index="3"><span id="meta-in">14.03.1998 — LYON</span></div>

      <div data-track-kind="captions">
        <div id="c1" class="cap clip" data-start="0.1" data-duration="2.5" data-track-index="5"><span id="c1i" style="display:block">Le 14 mars <em>1998</em>,</span></div>
        <div id="c2" class="cap clip" data-start="2.63" data-duration="0.86" data-track-index="5"><span id="c2i" style="display:block">à <em>Lyon</em>,</span></div>
        <div id="c3" class="cap clip" data-start="3.49" data-duration="1.01" data-track-index="5"><span id="c3i" style="display:block">une femme <em>disparaît</em></span></div>
        <div id="c4" class="cap clip" data-start="4.5" data-duration="1.34" data-track-index="5"><span id="c4i" style="display:block">sans laisser de <em>trace</em>.</span></div>
        <div id="c5" class="cap clip" data-start="5.84" data-duration="1.08" data-track-index="5"><span id="c5i" style="display:block"><em>Vingt ans</em> plus tard,</span></div>
        <div id="c6" class="cap clip" data-start="6.92" data-duration="2.08" data-track-index="5"><span id="c6i" style="display:block">un détail change <em>tout</em>.</span></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#file-tag-in", { opacity: 0.4 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0);
      tl.fromTo("#case-title-in", { scale: 1.04 }, { scale: 1, duration: 2.5, ease: "power2.out" }, 0);
      tl.fromTo("#rule-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.inOut" }, 1.0);
      tl.fromTo("#meta-in", { opacity: 0 }, { opacity: 0.85, duration: 0.6, ease: "power2.out" }, 1.3);
      [["#c1i",0.1],["#c2i",2.63],["#c3i",3.49],["#c4i",4.5],["#c5i",5.84],["#c6i",6.92]].forEach(([s,t]) => {
        tl.fromTo(s, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, t);
      });
      tl.to("#case-title-in", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 8.3);
      tl.to(["#meta-in", "#file-tag-in", "#c6i"], { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 8.3);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
