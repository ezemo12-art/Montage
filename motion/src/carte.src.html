<template>
  <link rel="stylesheet" href="assets/da.css" />
  <style>
    #root { position: absolute; inset: 0; background: var(--charbon); }
    #ca-tag { position: absolute; left: 150px; top: 290px; }
    #ca-frame { position: absolute; left: 220px; top: 400px; width: 640px; height: 600px; }
    #ca-map { position: absolute; inset: 0; transform-origin: 50% 50%; }
    #ca-svg { width: 100%; height: 100%; overflow: visible; }
    #ca-land { fill: var(--archive); fill-opacity: 0; stroke: var(--ivoire); stroke-width: 2.2; stroke-linejoin: round;
      stroke-dasharray: 1; stroke-dashoffset: 1; vector-effect: non-scaling-stroke; }
    #ca-ring { fill: none; stroke: var(--ambre); stroke-width: 2; vector-effect: non-scaling-stroke; }
    #ca-dot { fill: var(--ambre); }
    #ca-label { position: absolute; left: 150px; top: 1075px; width: 740px; }
    #ca-lieu { font-family: var(--font-display); font-weight: 700; font-size: 76px; line-height: 1.16; text-transform: uppercase; color: var(--ivoire); }
    #ca-coord { margin-top: 14px; display: inline-block; }
  </style>
  <div id="root" data-composition-id="carte" data-width="1080" data-height="1920"
    data-composition-variables='[
      {"id":"titre","type":"string","label":"Titre","default":"LIEU DES FAITS"},
      {"id":"lieu","type":"string","label":"Lieu","default":"Lyon"},
      {"id":"lat","type":"number","label":"Latitude","default":45.764,"step":0.0001},
      {"id":"lon","type":"number","label":"Longitude","default":4.8357,"step":0.0001}
    ]'>
    <div id="ca-tag" class="da-tag" data-var-text="titre">LIEU DES FAITS</div>
    <div id="ca-frame" data-layout-allow-overflow>
      <div id="ca-map">
        <svg id="ca-svg" viewBox="{{VIEWBOX}}" preserveAspectRatio="xMidYMid meet">
          <path id="ca-land" pathLength="1" d="{{PATH}}" />
          <g id="ca-pin">
            <circle id="ca-ring" cx="0" cy="0" r="10" />
            <circle id="ca-dot" cx="0" cy="0" r="9" />
          </g>
        </svg>
      </div>
    </div>
    <div id="ca-label">
      <div id="ca-lieu" data-var-text="lieu">Lyon</div>
      <div id="ca-coord" class="da-meta">45.7640° N — 4.8357° E</div>
    </div>
  </div>
  <script>
    // Projection Mercator identique à scripts/build_france_map.py (Natural Earth 1:50m).
    const P = {{PROJ}};
    const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
    const lat = Number(vars.lat ?? 45.764), lon = Number(vars.lon ?? 4.8357);
    const merc = (la) => (180 / Math.PI) * Math.log(Math.tan(Math.PI / 4 + (la * Math.PI) / 360));
    const x = (lon - P.lonMin) * P.k, y = (P.yTop - merc(lat)) * P.k;
    document.querySelector("#ca-pin").setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
    const fmt = (v, pos, neg) => `${Math.abs(v).toFixed(4)}° ${v >= 0 ? pos : neg}`;
    document.querySelector("#ca-coord").textContent = `${fmt(lat, "N", "S")} — ${fmt(lon, "E", "O")}`;
    // Point de zoom dans le cadre (viewBox → cadre 640 × 600, carte centrée).
    const vb = [{{VIEWBOX_ARR}}];
    const s = Math.min(640 / vb[2], 600 / vb[3]);
    const ox = (640 - vb[2] * s) / 2 + x * s, oy = (600 - vb[3] * s) / 2 + y * s;

    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#ca-tag", { opacity: 0.35 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0);
    tl.fromTo("#ca-land", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 2.0, ease: "power2.inOut" }, 0.2);
    tl.fromTo("#ca-land", { fillOpacity: 0 }, { fillOpacity: 1, duration: 0.8, ease: "power2.out" }, 2.0);
    tl.fromTo("#ca-dot", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.5, ease: "power2.out" }, 2.7);
    tl.fromTo("#ca-map", { scale: 1, transformOrigin: `${ox}px ${oy}px` }, { scale: 1.2, duration: 3.2, ease: "power2.inOut" }, 3.0);
    tl.fromTo("#ca-ring", { scale: 1, opacity: 0.9, transformOrigin: "50% 50%" }, { scale: 4, opacity: 0, duration: 1.6, ease: "power1.out", repeat: 2 }, 3.0);
    tl.fromTo("#ca-lieu", { opacity: 0, y: 20, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.9, ease: "expo.out" }, 3.4);
    tl.fromTo("#ca-coord", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.9, ease: "steps(24)" }, 4.4);
    tl.to("#root > *", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 6.6);
    window.__timelines["carte"] = tl;
  </script>
</template>
