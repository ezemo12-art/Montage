    <style id="da-inline">
/* DOSSIER 00 — valeurs officielles. Copier dans assets/da.css de chaque vidéo.
   Référence humaine : DA.md. Ne pas modifier sans mettre DA.md à jour. */
:root {
  --charbon: #101113;  /* fond */
  --archive: #29292b;  /* surfaces : dossiers, cartes, documents */
  --ivoire:  #e5ddcb;  /* texte */
  --ambre:   #d6a64a;  /* accent principal : œil, indices, mot clé */
  --rouge:   #9e2929;  /* alerte, rare : crime, révélation, tampon */
  --ivoire-doux: rgba(229, 221, 203, 0.8);

  /* alias génériques */
  --ground: var(--charbon);
  --ink: var(--ivoire);
  --accent: var(--ambre);

  --font-display: "Oswald";
  --font-mono: "IBM Plex Mono";
  --safe-left: 150px;
  --safe-width: 740px;
}
.da-tag     { font-family: var(--font-mono); font-size: 32px; letter-spacing: 0.2em; color: var(--ambre); text-transform: uppercase; }
.da-title   { font-family: var(--font-display); font-size: 128px; line-height: 1.16; font-weight: 700; text-transform: uppercase; color: var(--ivoire); }
.da-meta    { font-family: var(--font-mono); font-size: 40px; letter-spacing: 0.08em; color: var(--ivoire-doux); text-transform: uppercase; }
.da-rule    { height: 4px; background: var(--ambre); transform-origin: left center; }
.da-card    { background: var(--archive); color: var(--ivoire); }
.da-stamp   { font-family: var(--font-display); color: var(--rouge); border: 6px solid var(--rouge); text-transform: uppercase; letter-spacing: 0.1em; }
.da-caption { font-family: var(--font-display); font-size: 72px; font-weight: 600; line-height: 1.18; text-transform: uppercase; color: var(--ivoire); text-align: center; }
.da-caption em { font-style: normal; color: var(--ambre); }
.da-caption strong { font-weight: inherit; color: var(--rouge); } /* moment fort uniquement */

    </style>

      #fx-grain { position: absolute; inset: 0; z-index: 51; pointer-events: none; opacity: 0.07;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
